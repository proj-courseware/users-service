version: "3.8"

services:
  app:
    container_name: users-service-api
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - .:/app:delegated
      - /app/node_modules
    ports:
      - "${PORT}:${PORT}"
    environment:
      - NODE_ENV=development
      - PORT=${PORT}
      - MONGODB_HOST=mongo_db # Use service name instead of localhost
      - MONGODB_PORT=${MONGODB_PORT}
      - MONGODB_DATABASE=${MONGODB_DATABASE}
      - MONGODB_USER=${MONGODB_USER}
      - MONGODB_PASSWORD=${MONGODB_PASSWORD}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      - JWT_ACCESS_EXPIRY_MINUTES=${JWT_ACCESS_EXPIRY_MINUTES}
      - JWT_REFRESH_EXPIRY_DAYS=${JWT_REFRESH_EXPIRY_DAYS}
      - SMTP_HOST=mailpit # Use service name instead of localhost
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - MAILPIT_SMTP_PORT=${MAILPIT_SMTP_PORT}
      - MAILPIT_WEB_PORT=${MAILPIT_WEB_PORT}
      - REDIS_HOST=redis_cache # Use service name instead of localhost
      - REDIS_PORT=${REDIS_PORT}
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - FRONTEND_URL=${FRONTEND_URL}
      - RATE_LIMIT_WINDOW_MINUTES=${RATE_LIMIT_WINDOW_MINUTES}
      - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS}
      - RATE_LIMIT_AUTH_WINDOW_MINUTES=${RATE_LIMIT_AUTH_WINDOW_MINUTES}
      - RATE_LIMIT_AUTH_MAX_REQUESTS=${RATE_LIMIT_AUTH_MAX_REQUESTS}
      - RATE_LIMIT_STRICT_MODE=${RATE_LIMIT_STRICT_MODE}
      - SESSION_SECRET=${SESSION_SECRET}
      - SESSION_MAX_AGE_HOURS=${SESSION_MAX_AGE_HOURS}
      - CSRF_SECRET=${CSRF_SECRET}
      - CSRF_TOKEN_LENGTH=${CSRF_TOKEN_LENGTH}
      - CSRF_COOKIE_NAME=${CSRF_COOKIE_NAME}
      - CSRF_HEADER_NAME=${CSRF_HEADER_NAME}
      - ENABLE_CSRF_PROTECTION=${ENABLE_CSRF_PROTECTION}
    depends_on:
      mongo_db:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    command: /bin/sh -c "sleep infinity"
    user: node
    restart: unless-stopped
    networks:
      - app-network

  mongo_db:
    image: mongo:latest
    env_file:
      - .env
    ports:
      - "${MONGODB_PORT}:${MONGODB_PORT}"
    volumes:
      - mongodb_data:/data/db # Where MongoDB stores its data by default
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGODB_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGODB_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGODB_DATABASE}
    healthcheck:
      test:
        [
          "CMD",
          "mongosh",
          "--authenticationDatabase=admin",
          "-u",
          "${MONGODB_USER}",
          "-p",
          "${MONGODB_PASSWORD}",
          "--eval",
          "db.runCommand('ping').ok",
          "--quiet",
        ]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  redis_cache:
    image: redis:latest
    env_file:
      - .env
    ports:
      - "${REDIS_PORT}:${REDIS_PORT}"
    volumes:
      - redis_data:/data # Where Redis stores its data by default
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    restart: unless-stopped
    networks:
      - app-network

  mailpit:
    image: axllent/mailpit:latest
    env_file:
      - .env
    ports:
      - "${MAILPIT_SMTP_PORT}:${MAILPIT_SMTP_PORT}" # SMTP port
      - "${MAILPIT_WEB_PORT}:${MAILPIT_WEB_PORT}" # Web UI port
    environment:
      - MP_SMTP_BIND_ADDR=0.0.0.0:${MAILPIT_SMTP_PORT}
      - MP_WEB_BIND_ADDR=0.0.0.0:${MAILPIT_WEB_PORT}
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:${MAILPIT_WEB_PORT}",
        ]
      interval: 10s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
