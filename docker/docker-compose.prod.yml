version: "3.8"

services:
  app:
    container_name: users-service-app
    build:
      context: ../ # relative to this file
      dockerfile: docker/Dockerfile.prod # relative to the build context
    env_file:
      - .env.production # relative to this file
    ports:
      - "${PORT}:${PORT}" # Map port host:container
    environment:
      - NODE_ENV=production
      - PORT=${PORT}
      # In production, these would typically be external services
      # Uncomment and configure as needed for your production environment
      # - MONGODB_HOST=${MONGODB_HOST}
      # - MONGODB_PORT=${MONGODB_PORT}
      # - MONGODB_DATABASE=${MONGODB_DATABASE}
      # - MONGODB_USER=${MONGODB_USER}
      # - MONGODB_PASSWORD=${MONGODB_PASSWORD}
      # - REDIS_HOST=${REDIS_HOST}
      # - REDIS_PORT=${REDIS_PORT}
      # - REDIS_PASSWORD=${REDIS_PASSWORD}
      # - SMTP_HOST=${SMTP_HOST}
      # - SMTP_PORT=${SMTP_PORT}
      # - SMTP_SECURE=${SMTP_SECURE}
      # - SMTP_USER=${SMTP_USER}
      # - SMTP_PASSWORD=${SMTP_PASSWORD}
    command: /bin/sh -c "npm run start"
    user: node
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
