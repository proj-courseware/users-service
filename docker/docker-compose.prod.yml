version: "3.8"

name: users-service
services:
  app:
    container_name: users-service-app
    build:
      context: ../ # relative to this file
      dockerfile: docker/Dockerfile.prod # relative to the build context
    env_file:
      - .env.production # relative to this file
    ports:
      - "${PORT}:${PORT}" # Map port host:container
    environment:
      - NODE_ENV=production
      - PORT=${PORT}
      # In production, these would typically be external services
      # Uncomment and configure as needed for your production environment
      # - MONGODB_HOST=${MONGODB_HOST}
      # - MONGODB_PORT=${MONGODB_PORT}
      # - MONGODB_DATABASE=${MONGODB_DATABASE}
      # - MONGODB_USER=${MONGODB_USER}
      # - MONGODB_PASSWORD=${MONGODB_PASSWORD}
      # - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
      # - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
      # - JWT_ACCESS_EXPIRY_MINUTES=${JWT_ACCESS_EXPIRY_MINUTES}
      # - JWT_REFRESH_EXPIRY_DAYS=${JWT_REFRESH_EXPIRY_DAYS}
      # - SMTP_HOST=${SMTP_HOST}
      # - SMTP_PORT=${SMTP_PORT}
      # - SMTP_SECURE=${SMTP_SECURE}
      # - SMTP_USER=${SMTP_USER}
      # - SMTP_PASSWORD=${SMTP_PASSWORD}
      # - SMTP_FROM_ADDRESS=${SMTP_FROM_ADDRESS}
      # - MAILPIT_SMTP_PORT=${MAILPIT_SMTP_PORT}
      # - MAILPIT_WEB_PORT=${MAILPIT_WEB_PORT}
      # - REDIS_HOST=${REDIS_HOST}
      # - REDIS_PORT=${REDIS_PORT}
      # - REDIS_PASSWORD=${REDIS_PASSWORD}
      # - FRONTEND_URL=${FRONTEND_URL}
      # - RATE_LIMIT_WINDOW_MINUTES=${RATE_LIMIT_WINDOW_MINUTES}
      # - RATE_LIMIT_MAX_REQUESTS=${RATE_LIMIT_MAX_REQUESTS}
      # - RATE_LIMIT_AUTH_WINDOW_MINUTES=${RATE_LIMIT_AUTH_WINDOW_MINUTES}
      # - RATE_LIMIT_AUTH_MAX_REQUESTS=${RATE_LIMIT_AUTH_MAX_REQUESTS}
      # - RATE_LIMIT_STRICT_MODE=${RATE_LIMIT_STRICT_MODE}
      # - SESSION_SECRET=${SESSION_SECRET}
      # - SESSION_MAX_AGE_HOURS=${SESSION_MAX_AGE_HOURS}
      # - CSRF_SECRET=${CSRF_SECRET}
      # - CSRF_TOKEN_LENGTH=${CSRF_TOKEN_LENGTH}
      # - CSRF_COOKIE_NAME=${CSRF_COOKIE_NAME}
      # - CSRF_HEADER_NAME=${CSRF_HEADER_NAME}
      # - ENABLE_CSRF_PROTECTION=${ENABLE_CSRF_PROTECTION}
    command: /bin/sh -c "npm run start"
    user: node
    restart: unless-stopped
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
